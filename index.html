<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Planner - Manajemen Aktivitas</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eef2ff 0%, #f5f3ff 45%, #fdf2f8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 470px;
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 20px 45px rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        header h1 {
            color: #312e81;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 6px;
            text-align: center;
        }

        header p {
            color: #6b7280;
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 24px;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.88rem;
            font-weight: 600;
            color: #4338ca;
        }

        input {
            padding: 12px 14px;
            border: 1.5px solid #dbe4ff;
            border-radius: 14px;
            outline: none;
            background: #f8faff;
            color: #1f2937;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #9ca3af;
        }

        input:focus {
            border-color: #7c3aed;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.10);
        }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 13px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.22);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 26px rgba(79, 70, 229, 0.28);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        hr {
            margin: 24px 0 18px;
            border: 0;
            border-top: 1px solid #ececff;
        }

        h3 {
            font-size: 1rem;
            color: #312e81;
            margin-bottom: 12px;
            font-weight: 600;
        }

        #listJadwal {
            list-style: none;
            margin-top: 6px;
        }

        .item-jadwal {
            background: linear-gradient(135deg, #ffffff, #f8faff);
            padding: 14px 14px;
            border-radius: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-left: 6px solid #6366f1;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.06);
            transition: all 0.25s ease;
            animation: slideIn 0.3s ease-out;
        }

        .item-jadwal:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 24px rgba(99, 102, 241, 0.12);
        }

        .konten {
            color: #334155;
            font-size: 0.92rem;
            line-height: 1.5;
            cursor: pointer;
            flex: 1;
        }

        .konten strong {
            color: #4f46e5;
            font-weight: 700;
        }

        .selesai {
            border-left-color: #22c55e;
            background: linear-gradient(135deg, #f0fdf4, #ecfdf5);
            opacity: 0.92;
        }

        .selesai .konten {
            text-decoration: line-through;
            color: #6b7280;
        }

        .selesai .konten strong {
            color: #16a34a;
        }

        .btn-hapus {
            background: linear-gradient(135deg, #fb7185, #e11d48);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .btn-hapus:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 18px rgba(225, 29, 72, 0.20);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 500px) {
            .container {
                padding: 1.4rem;
                border-radius: 20px;
            }

            header h1 {
                font-size: 1.5rem;
            }

            .item-jadwal {
                flex-direction: column;
                align-items: flex-start;
            }

            .btn-hapus {
                align-self: flex-end;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Daily Planner 📅</h1>
        <p>Kelola jadwal harian dengan tampilan yang lebih segar</p>
    </header>

    <div class="input-section">
        <div class="input-group">
            <label for="aktivitas">Nama Aktivitas</label>
            <input type="text" id="aktivitas" placeholder="Masukkan aktivitas hari ini">
        </div>

        <div class="input-group">
            <label for="waktuAktivitas">Waktu Pelaksanaan</label>
            <input type="time" id="waktuAktivitas">
        </div>
        
        <button id="btnTambah" class="btn-primary">Tambahkan ke Jadwal</button>
    </div>

    <hr>

    <div class="list-section">
        <h3>Daftar Rencana Anda</h3>
        <ul id="listJadwal"></ul>
    </div>
</div>

<script>
    const inputAktivitas = document.getElementById('aktivitas');
    const inputWaktu = document.getElementById('waktuAktivitas');
    const btnTambah = document.getElementById('btnTambah');
    const listJadwal = document.getElementById('listJadwal');

    function tambahJadwal() {
        const teksAktivitas = inputAktivitas.value.trim();
        const teksWaktu = inputWaktu.value;

        if (teksAktivitas === "" || teksWaktu === "") {
            alert("Mohon isi aktivitas dan waktunya!");
            return;
        }

        const li = document.createElement('li');
        li.classList.add('item-jadwal'); 
        
        li.innerHTML = `
            <span class="konten">
                <strong>${teksWaktu}</strong> - ${teksAktivitas}
            </span>
            <button class="btn-hapus">Hapus</button>
        `;

        listJadwal.appendChild(li);

        inputAktivitas.value = "";
        inputWaktu.value = "";
        inputAktivitas.focus();
    }

    listJadwal.addEventListener('click', function(e) {
        if (e.target.classList.contains('btn-hapus')) {
            e.target.parentElement.remove();
            return;
        }

        const targetLi = e.target.closest('li');
        if (targetLi) {
            targetLi.classList.toggle('selesai');
        }
    });

    inputAktivitas.addEventListener('input', function() {
        if (this.value.length > 50) {
            this.style.borderColor = "#ef4444";
            this.style.boxShadow = "0 0 0 4px rgba(239, 68, 68, 0.10)";
        } else {
            this.style.borderColor = "#dbe4ff";
            this.style.boxShadow = "none";
        }
    });

    inputAktivitas.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            tambahJadwal();
        }
    });

    btnTambah.addEventListener('click', tambahJadwal);
</script>

</body>
</html>
