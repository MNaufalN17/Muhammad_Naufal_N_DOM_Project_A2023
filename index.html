<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Tugas Kuliah</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Manajemen Tugas Kuliah</h1>
        
        <!-- Form untuk menambahkan mata kuliah -->
        <input type="text" id="courseInput" placeholder="Nama Mata Kuliah">
        <input type="date" id="deadlineInput">
        <button id="addButton">Tambah Mata Kuliah</button>

        <!-- Daftar mata kuliah yang sudah ditambahkan -->
        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
